name: Release verified binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      build_run_id:
        description: Verified full build run ID (empty searches by tagged commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: mp_audio_stream-example

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: reki2000/mp-build-tools/release-binaries@REPLACE_WITH_PUBLISHED_SHA
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          build-run-id: ${{ inputs.build_run_id }}
