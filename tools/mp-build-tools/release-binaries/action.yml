name: Release verified CI binaries
description: Promote exact tagged CI artifacts without rebuilding or re-signing.
inputs:
  tag:
    description: "Existing tag matching the root pubspec version."
    required: true
  artifact-name:
    description: "Application distribution filename prefix."
    required: true
  build-run-id:
    description: "Optional verified CI run ID; otherwise search by tagged commit."
    default: ""
  build-workflow:
    description: "Caller workflow filename producing the complete binary set."
    default: "build-binaries.yaml"
  token:
    description: "Token with caller Actions read and contents write permissions."
    default: "${{ github.token }}"
outputs:
  build-run-id:
    description: Verified source CI run ID.
    value: ${{ steps.verified.outputs.run_id }}
runs:
  using: composite
  steps:
    - name: Check the tag and retain published releases
      id: source
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: bash "${ACTION_PATH//\\//}/../scripts/release.sh" check-tag
    - name: Find the successful full CI build
      id: find
      if: steps.source.outputs.publish == 'true'
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        workflow: ${{ inputs.build-workflow }}
        commit: ${{ inputs.build-run-id == '' && steps.source.outputs.commit || '' }}
        run_id: ${{ inputs.build-run-id }}
        workflow_conclusion: ${{ inputs.build-run-id == '' && 'success' || '' }}
        name: full-build-success
        search_artifacts: true
        dry_run: true
        if_no_artifact_found: fail
        github_token: ${{ inputs.token }}
    - name: Verify the exact CI commit and complete platform set
      id: verified
      if: steps.source.outputs.publish == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        FOUND_ARTIFACTS: ${{ steps.find.outputs.artifacts }}
        COMMIT: ${{ steps.source.outputs.commit }}
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_TAG: ${{ inputs.tag }}
        BUILD_WORKFLOW: ${{ inputs.build-workflow }}
      with:
        github-token: ${{ inputs.token }}
        script: await require(`${process.env.ACTION_PATH}/../scripts/verify-release.cjs`)({github, context, core});
    - name: Download the exact verified artifacts
      if: steps.source.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        github-token: ${{ inputs.token }}
        run-id: ${{ steps.verified.outputs.run_id }}
        artifact-ids: ${{ steps.verified.outputs.artifact_ids }}
        path: release-assets
        digest-mismatch: error
    - name: Check asset versions and generate checksums
      if: steps.source.outputs.publish == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ steps.source.outputs.version }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: bash "${ACTION_PATH//\\//}/../scripts/release.sh" checksums
    - name: Attach the verified binaries to a draft
      if: steps.source.outputs.publish == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        token: ${{ inputs.token }}
        tag_name: ${{ inputs.tag }}
        draft: true
        prerelease: ${{ contains(steps.source.outputs.version, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          release-assets/release-*/*
          SHA256SUMS.txt
          BUILD-METADATA.json
    - name: Publish after every upload succeeds
      if: steps.source.outputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: gh release edit "$RELEASE_TAG" --draft=false --verify-tag
