name: Build release v1.0.0

on:
  push:
    branches: ['build/release-v1.0.0-20261016']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reki2000/mp-build-tools
          ref: 76572b43db6ace5ac8037b3b6e2f7cb744b44a01
          persist-credentials: false
      - id: plan
        run: |
          node - <<'JS'
          const {appendFileSync} = require('node:fs');
          const {select} = require('./scripts/plan.cjs');
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify(select()) + '\n');
          JS

  build:
    needs: plan
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 922a2eb319d3b52d73f4f95d2db45edc7f387480
          submodules: recursive
          persist-credentials: false
      - name: Record the exact release source
        run: |
          test "$(git rev-parse HEAD)" = "922a2eb319d3b52d73f4f95d2db45edc7f387480"
          printf 'Source: v1.0.0 (%s)\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: reki2000/mp-build-tools/flutter-build@76572b43db6ace5ac8037b3b6e2f7cb744b44a01
        with:
          target: ${{ matrix.target }}
          architecture: ${{ matrix.arch }}
          artifact-name: fnesemu
          web-javascript: 'false'
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ios-certificate-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          ios-certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ios-profile-base64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ios-export-options-base64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
