name: Release verified binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      build_run_id:
        description: Verified full build run ID (empty searches by tagged commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
    uses: reki2000/mp-build-tools/.github/workflows/release.yaml@5ce3c81ab5e0becc55ac0a87005b5d04eae914b6
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      artifact-name: fnesemu
      build-run-id: ${{ inputs.build_run_id }}
