name: Core and Web regressions

on:
  push:
    branches:
      - 'develop'
  pull_request:
    branches:
      - 'develop'

jobs:
  test-macos:
    name: GUI tests on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true
      - run: flutter test

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Flutter Test / Build
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart pub get && dart test
        working-directory: packages/cdrom_image
      - run: dart test
        working-directory: packages/fnesemu_core
      - name: Video regression tests on WebAssembly
        run: dart test --platform chrome --compiler dart2wasm test/core/pce/sgx_test.dart test/core/pce/vdc_render_test.dart test/core/pce/run_frame_test.dart test/core/ps/gpu/display_aspect_test.dart
        working-directory: packages/fnesemu_core
      - run: flutter test
