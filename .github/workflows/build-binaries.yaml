name: Build binaries

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation or release workflows skip the
  # build. Pushes and manual runs always build, because release artifacts come
  # from the push build on main.
  changes:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '(\.md$|^docs/|^\.github/workflows/release(-pr)?\.yaml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: write
    uses: reki2000/mp-build-tools/.github/workflows/build.yaml@5ce3c81ab5e0becc55ac0a87005b5d04eae914b6
    with:
      artifact-name: fnesemu
      exclude: '["web-js"]'
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}

  # Required by the existing develop branch protection rule.
  build:
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: |
          if [[ "$BUILD" != true ]]; then
            echo "No build-affecting changes."
            exit 0
          fi
          test "$CI_RESULT" = success
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          CI_RESULT: ${{ needs.ci.result }}
