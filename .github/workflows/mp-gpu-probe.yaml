name: mp_gpu probe

# Builds the probe of packages/mp_gpu/example for each platform and runs it.
# The probe lines go to the job summary. The runners have no real GPU:
# Linux runs Mesa llvmpipe, Windows WARP, Android SwiftShader and the Web
# SwiftShader, so the results show the behavior of the APIs, not of real
# drivers.

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: 3.47.9
  EXAMPLE: packages/mp_gpu/example

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb mesa-utils libgl1-mesa-dri
      - run: sh tool/prepare.sh linux && flutter build linux --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B || true
          MP_GPU_PROBE_OUT=$PWD/probe.out xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout 600 build/linux/x64/release/bundle/mp_gpu_probe || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sh tool/prepare.sh windows && flutter build windows --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          MP_GPU_PROBE_OUT="$(cygpath -w "$PWD/probe.out")" \
            timeout 600 build/windows/x64/runner/Release/mp_gpu_probe.exe || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sh tool/prepare.sh macos && flutter build macos --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          MP_GPU_PROBE_OUT=$PWD/probe.out \
            perl -e 'alarm 600; exec @ARGV' build/macos/Build/Products/Release/mp_gpu_probe.app/Contents/MacOS/mp_gpu_probe || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # A simulator build is a debug build.
      - run: sh tool/prepare.sh ios && flutter build ios --simulator --debug
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          sh tool/run_ios.sh || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sh tool/prepare.sh android && flutter build apk --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: ${{ env.EXAMPLE }}
          script: sh tool/run_android.sh || true
      - working-directory: ${{ env.EXAMPLE }}
        run: |
          cat probe.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.log

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tool/prepare.sh web && flutter build web --wasm
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          (cd build/web && python3 -m http.server 8777 > /dev/null 2>&1 &)
          sleep 2
          timeout 600 node tool/run_web.mjs http://127.0.0.1:8777/ --enable-unsafe-webgpu | tee probe.out || true
          cat probe.out >> "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out
