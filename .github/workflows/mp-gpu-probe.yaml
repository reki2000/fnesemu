name: mp_gpu probe

# Builds the probe of packages/mp_gpu/example for each platform and runs it.
# The probe lines go to the job summary. The runners have no real GPU:
# Linux runs Mesa llvmpipe, Windows WARP and the Web SwiftShader, so the
# results show the behavior of the APIs, not of real drivers. Emulators and
# simulators tell even less; run tool/run_android.sh on a real device.

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: 3.47.9
  EXAMPLE: packages/mp_gpu/example

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb mesa-utils libgl1-mesa-dri
      - run: sh tool/prepare.sh linux && flutter build linux --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B || true
          MP_GPU_PROBE_OUT=$PWD/probe.out xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout 600 build/linux/x64/release/bundle/mp_gpu_probe || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sh tool/prepare.sh windows && flutter build windows --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          MP_GPU_PROBE_OUT="$(cygpath -w "$PWD/probe.out")" \
            timeout 600 build/windows/x64/runner/Release/mp_gpu_probe.exe || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sh tool/prepare.sh macos && flutter build macos --release
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          # The sandbox of the app keeps it from writing files, so the
          # results come from its output.
          perl -e 'alarm 600; exec @ARGV' build/macos/Build/Products/Release/mp_gpu_probe.app/Contents/MacOS/mp_gpu_probe > probe.log 2>&1 || true
          grep -E 'MP_GPU_PROBE|Impeller' probe.log | sed 's/^.*\(MP_GPU_PROBE\)/\1/' > probe.out || true
          cat probe.out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tool/prepare.sh web && flutter build web --wasm
        working-directory: ${{ env.EXAMPLE }}
      - name: Run
        working-directory: ${{ env.EXAMPLE }}
        run: |
          (cd build/web && python3 -m http.server 8777 > /dev/null 2>&1 &)
          sleep 2
          timeout 600 node tool/run_web.mjs http://127.0.0.1:8777/ --enable-unsafe-webgpu | tee probe.out || true
          cat probe.out >> "$GITHUB_STEP_SUMMARY"
          grep -q MP_GPU_PROBE_DONE probe.out
