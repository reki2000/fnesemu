name: fnesemu
description: A multiplatform NES/PCE/MD/PS1/N64 Emulator written in Flutter.

publish_to: none # Remove this line if you wish to publish to pub.dev

version: 1.0.0+0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ^3.27.3

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  package_info_plus: ^10.2.2
  mp_audio_stream: ^0.3.0
  archive: ^3.1.2
  image: ^4.3.0
  idb_shim: ^2.9.9
  path_provider: ^2.1.6
  web: ^1.1.1
  mp_bigfile_picker:
    path: packages/mp_bigfile_picker

  test: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  file_picker_platform_interface: any
flutter:
  uses-material-design: true

