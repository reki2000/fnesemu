name: fnesemu
description: A multiplatform NES/PCE/MD/PS1 Emulator written in Flutter.

publish_to: none # Remove this line if you wish to publish to pub.dev

version: 0.7.0+0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ^3.27.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  file_picker: ^9.0.0
  package_info_plus: ^8.0.0
  mp_audio_stream: ^0.2.2
  test: ^1.21.1
  archive: ^3.1.2
  shared_preferences: ^2.5.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/roms/

import_path_converter:
  relative: true # true->relative path, false->package path (default: false)
