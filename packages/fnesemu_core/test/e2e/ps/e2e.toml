# End-to-end cases of this core, run by scripts/e2e.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the result that the media reports is a failure; the outputs must still match expected/.
# The test EXEs run after OpenBIOS (openbios/, built from source) boots. Each case compares the whole VRAM with
# the VRAM dump of the real hardware that the release has, so no expected/ data is kept here: the share of pixels
# whose channel differs by more than 8 must not grow (max_diff is the share when the case was recorded, plus 0.0005).
# Most of that difference is where a test does not draw (white on the hardware, black here).
# The tests that print their results to the tty compare it with expected/<case>.tty.txt (the current output, from
# the OpenBIOS banner on). tty_fail is the pattern of the lines with which a test reports a failure; such lines count
# as a failure against the upstream reference. The psx.log of the release is the output of the real hardware, but
# some of the logs are older than the test EXEs, so it is not compared line by line.

[[case]]
name = "gpu-clipping"
dir = "ps1-tests"
files = ["../openbios/.build/openbios.bin"]
args = ["-x", "./.build/ps1-tests/gpu/clipping/clipping.exe"]
frames = 600
checks = [{ vram = ".build/ps1-tests/gpu/clipping/vram.png", channel_tol = 8, max_diff = 0.0005 }]

