args = ["-b", "../cult-bios/.build/bios.bin"]
frames = 180
description = "BIOS functions; the result also depends on the replacement BIOS."
known_failure = "Failed test 001"
checks = [{ frame = 180, expected = "expected/bios_00180.png" }]

