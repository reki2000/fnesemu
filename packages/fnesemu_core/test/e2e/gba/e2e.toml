# End-to-end cases of this core, run by scripts/e2e.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the result that the media reports is a failure; the outputs must still match expected/.
# Each ROM shows "All tests passed" or the number of the first failed test (mode 4).
# The test ROMs call BIOS functions, so every case boots the replacement BIOS of cult-bios/ (-b).

[[case]]
name = "arm"
dir = "gba-tests"
files = [".build/gba-tests/arm/arm.gba"]
args = ["-b", "../cult-bios/.build/bios.bin"]
frames = 600
description = "ARM instructions."
checks = [{ frame = 600, expected = "expected/arm_00600.png" }]

[[case]]
name = "thumb"
dir = "gba-tests"
files = [".build/gba-tests/thumb/thumb.gba"]
args = ["-b", "../cult-bios/.build/bios.bin"]
frames = 180
description = "THUMB instructions."
checks = [{ frame = 180, expected = "expected/thumb_00180.png" }]

