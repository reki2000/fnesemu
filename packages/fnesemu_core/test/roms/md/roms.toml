# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.
# Not run: opcode-sizes measures the instructions with the trace exception, which the core does not emulate, so the
# program loses its way and the stack pointer becomes odd.

[[case]]
name = "bcd-verifier"
dir = "exodus-tests"
files = [".build/bcd-verifier.bin"]
frames = 480
description = "68000 ABCD/SBCD/NBCD results and flags against a table; shows the error counts (0 is a pass)."
checks = [{ frame = 480, expected = "expected/bcd-verifier_00480.png" }]

[[case]]
name = "sprite-masking"
dir = "exodus-tests"
files = [".build/sprite-masking.bin"]
frames = 120
description = "Sprite masking and overflow in H32 mode."
known_failure = "a cross on 9. max sprites per frame"
checks = [{ frame = 120, expected = "expected/sprite-masking_00120.png" }]

[[case]]
name = "memtest-68k"
dir = "exodus-tests"
files = [".build/memtest-68k.bin"]
frames = 120
description = "68000 reads of the memory map; shows the values without PASS/FAIL."
checks = [{ frame = 120, expected = "expected/memtest-68k_00120.png" }]

[[case]]
name = "vcounter"
dir = "exodus-tests"
files = [".build/vcounter.bin"]
frames = 360
input = ":12 @60 Start @150 C @270 C"
description = "The V counter test: Start runs the test of the first mode, C shows the next of the 3 pages of the counter values."
checks = [{ frame = 40, expected = "expected/vcounter_00040.png" }, { frame = 120, expected = "expected/vcounter_00120.png" }, { frame = 240, expected = "expected/vcounter_00240.png" }, { frame = 360, expected = "expected/vcounter_00360.png" }]

[[case]]
name = "vdp-disable-reg"
dir = "exodus-tests"
files = [".build/vdp-disable-reg.bin"]
frames = 120
description = "A VDP register test; the screen is filled with one color."
checks = [{ frame = 120, expected = "expected/vdp-disable-reg_00120.png" }]

[[case]]
name = "cram-flicker"
dir = "exodus-tests"
files = [".build/cram-flicker.bin"]
frames = 120
description = "CRAM writes during display; the screen is black here."
checks = [{ frame = 120, expected = "expected/cram-flicker_00120.png" }]

[[case]]
name = "color-1536"
dir = "exodus-tests"
files = [".build/color-1536.bin"]
frames = 600
description = "1536-color display; the picture keeps changing."
checks = [{ frame = 600, expected = "expected/color-1536_00600.png" }]

[[case]]
name = "shadow-highlight"
dir = "exodus-tests"
files = [".build/shadow-highlight.bin"]
frames = 600
description = "Shadow and highlight colors; the picture keeps changing."
checks = [{ frame = 600, expected = "expected/shadow-highlight_00600.png" }]

[[case]]
name = "window"
dir = "exodus-tests"
files = [".build/window.bin"]
frames = 120
description = "The window plane; the screen is black here."
checks = [{ frame = 120, expected = "expected/window_00120.png" }]

[[case]]
name = "window-distortion"
dir = "exodus-tests"
files = [".build/window-distortion.bin"]
frames = 600
description = "A window plane distortion; the picture keeps changing."
checks = [{ frame = 600, expected = "expected/window-distortion_00600.png" }]

[[case]]
name = "vdp-fifo"
dir = "exodus-tests"
files = [".build/vdp-fifo.bin"]
frames = 600
description = "VDPFIFOTesting (VDP Port Access Test ROM): the FIFO, DMA and byte order of the VDP ports; the first page lists 9 tests."
known_failure = "Results 0/9/9: every test of the first page fails"
checks = [{ frame = 600, expected = "expected/vdp-fifo_00600.png" }]

[[case]]
name = "illegal-opcodes"
dir = "exodus-tests"
files = [".build/illegal-opcodes.bin"]
frames = 300
description = "Every opcode that the 68000 does not define must raise the illegal instruction exception (line A / line F use their own vectors). A green screen is a pass, red a fail."
known_failure = "a red screen: some undefined opcodes do not raise the exception"
checks = [{ frame = 300, expected = "expected/illegal-opcodes_00300.png" }]
