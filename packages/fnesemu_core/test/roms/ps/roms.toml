# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.
# The test EXEs run after OpenBIOS (openbios/, built from source) boots. Each case compares the whole VRAM with
# expected/ exactly, and with the VRAM dump of the real hardware that the release has: the share of pixels whose
# channel differs by more than 8 must not grow (max_diff is the share when the case was recorded, plus 0.0005).
# Most of that difference is where a test does not draw (white on the hardware, black here).

[[case]]
name = "gpu-clipping"
dir = "ps1-tests"
files = ["../openbios/.build/openbios.bin"]
args = ["-x", "./.build/ps1-tests/gpu/clipping/clipping.exe"]
frames = 600
checks = [{ vram = "expected/gpu-clipping_vram.png" }, { vram = ".build/ps1-tests/gpu/clipping/vram.png", channel_tol = 8, max_diff = 0.0005 }]

