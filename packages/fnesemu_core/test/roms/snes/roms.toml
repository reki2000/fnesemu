# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.

[[case]]
name = "cputest-basic"
dir = "snes-tests"
files = [".build/cputest-basic.sfc"]
frames = 180
description = "65816 instructions in all modes; stops at the first failure and shows the test number (see cputest/tests-basic.txt upstream)."
checks = [{ frame = 180, expected = "expected/cputest-basic_00180.png" }]

[[case]]
name = "cputest-full"
dir = "snes-tests"
files = [".build/cputest-full.sfc"]
frames = 120
description = "65816 instructions with more operand values; stops at the first failure (see cputest/tests-full.txt upstream)."
known_failure = "Failed, test number 0103 (COP in emulation mode)"
checks = [{ frame = 120, expected = "expected/cputest-full_00120.png" }]

