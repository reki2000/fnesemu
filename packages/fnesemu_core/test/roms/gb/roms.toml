# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.

[[case]]
name = "cpu_instrs"
dir = "blargg"
files = [".build/gb-test-roms/cpu_instrs/cpu_instrs.gb"]
frames = 3600
checks = [{ frame = 3600, expected = "expected/cpu_instrs_03600.png" }]

[[case]]
name = "instr_timing"
dir = "blargg"
files = [".build/gb-test-roms/instr_timing/instr_timing.gb"]
frames = 300
checks = [{ frame = 300, expected = "expected/instr_timing_00300.png" }]

[[case]]
name = "mem_timing"
dir = "blargg"
files = [".build/gb-test-roms/mem_timing/mem_timing.gb"]
frames = 600
checks = [{ frame = 600, expected = "expected/mem_timing_00600.png" }]

[[case]]
name = "halt_bug"
dir = "blargg"
files = [".build/gb-test-roms/halt_bug.gb"]
frames = 300
checks = [{ frame = 300, expected = "expected/halt_bug_00300.png" }]

[[case]]
name = "dmg_sound"
dir = "blargg"
files = [".build/gb-test-roms/dmg_sound/dmg_sound.gb"]
frames = 2400
known_failure = "09 (wave read while on), 10 (wave trigger while on) and 12 (wave) fail"
checks = [{ frame = 2400, expected = "expected/dmg_sound_02400.png" }]

[[case]]
name = "dmg-acid2"
files = [".build/dmg-acid2.gb"]
frames = 120
note = "the upstream reference image, with the core palette mapped to its gray levels"
checks = [{ frame = 120, expected = ".build/reference-dmg.png", palette = { e0f8d0 = "ffffff", "88c070" = "aaaaaa", "346856" = "555555", "081820" = "000000" } }]
