# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.
# Not run: the TEQ and unaligned exception tests stop the core (an unhandled exception), and the RSPTest ROMs need
# the RSP to run microcode, while the core runs RSP tasks by HLE: exceptionteq, exceptionteqdelay, exceptionunaligned, exceptionunaligneddelay, rspcp2ltv, rspcp2lwv, rspcp2v056, rspcp2v073, rspcp2vabs, rspcp2vacc, rspcp2vadd, rspcp2vaddb, rspcp2vand, rspcp2vcl, rspcp2vcr, rspcp2veq, rspcp2vextn, rspcp2vextq, rspcp2vextt, rspcp2vlt, rspcp2vmacf, rspcp2vmadl, rspcp2vmadn, rspcp2vmudl, rspcp2vmudn, rspcp2vmulf, rspcp2vmulq, rspcp2vnop, rspcp2vor, rspcp2vrcp, rspcp2vrcph, rspcp2vrcpl, rspcp2vrndp, rspcp2vsac, rspcp2vsar, rspcp2vsub, rspcp2vsubb, rspcp2vsut, rspcp2vxor, rspcpuadd, rspcpuaddu, rspcpuand, rspcpunor, rspcpuor, rspcpusll, rspcpusllv, rspcpusra, rspcpusrav, rspcpusrl, rspcpusrlv, rspcpusub, rspcpusubu, rspcpuxor, rspimem, rspsort, rsptransposematrix, rsptransposematrixvmov, rspxbusrdp

