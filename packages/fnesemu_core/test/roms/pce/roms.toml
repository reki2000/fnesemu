# ROM harness cases of this core, run by scripts/romtest.py; one [[case]] table per case.
# Paths are relative to <dir>/ (the case name when dir is absent); .build/ holds what <dir>/setup.py prepares.
# known_failure records why the ROM's own result is a failure; the outputs must still match expected/.
# These card ROMs show pictures without PASS/FAIL, so expected/ records the current behavior. The noise-like blocks
# in some of them look like sprites made of the power-on VRAM, which the core fills with fixed-seed random values.

[[case]]
name = "240p-suite"
dir = "display-tests"
files = [".build/240p-suite.pce"]
frames = 120
description = "240p Test Suite 1.10, the card build (GPL-2.0): the main menu."
checks = [{ frame = 120, expected = "expected/240p-suite_00120.png" }]

