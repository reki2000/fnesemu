name: mp_gpu
description: Offscreen drawing on the GPU of the platform, Flutter GPU on native platforms and WebGPU on the Web.
version: 0.1.0

publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  vector_math: ^2.1.4
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - shaders/check.shaderbundle
