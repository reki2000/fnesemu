name: mp_gpu_probe
description: Checks how soon the pixels of a pass can be read back on each platform.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  mp_gpu:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shaders/probe.shaderbundle
    - shaders/probe.wgsl
    - shaders/vram.wgsl
