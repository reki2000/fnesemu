name: render_frame_gpu
description: Draws the render frames of a core on the GPU of the platform.
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  fnesemu_core:
    path: ../fnesemu_core
  mp_gpu:
    path: ../mp_gpu

flutter:
  assets:
    - shaders/frame.shaderbundle
    - shaders/frame.wgsl
    - shaders/ps2.shaderbundle
    - shaders/ps2.wgsl
    - shaders/ps2_sprite.wgsl
